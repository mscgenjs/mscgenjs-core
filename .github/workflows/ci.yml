name: linting & test coverage - linux

on:
  push:
    branches:
      - master
  pull_request:

env:
  CI: true

defaults:
  run:
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 25.x
        platform:
          - ubuntu-latest

    runs-on: ${{matrix.platform}}

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: cache node modules for ${{matrix.node-version}}@${{matrix.platform}}
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: node_modules
          key: ${{matrix.node-version}}@${{matrix.platform}}-build-${{hashFiles('package.json')}}
          restore-keys: |
            ${{matrix.node-version}}@${{matrix.platform}}-build-
      - name: set up node ${{matrix.node-version}}@${{matrix.platform}}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{matrix.node-version}}
      - name: install & build
        run: |
          node --version
          npm install
          npm run build
      - name: forbidden dependency check (runs on one platform only)
        run: |
          node --version
          npm run depcruise
      - name: test
        if: matrix.node-version == '25.x'
        run: |
          node --version
          npm run test:cover
      - name: test
        # node 18 doesn't throw a warning when using the native 'punycode' module
        # it _does_ throw an error when you want to ignore that warning, though.
        # punycode is b.t.w. pulled in transitively by jsdom
        if: matrix.node-version == '18.x'
        run: |
          node --version
          npm run test:node18
